name: Refresh Model 13 research dashboards (no odds API)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-collector
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical test dependency
        run: python -m pip install pandas==2.3.3
      - name: Confirm scripts and data integrity
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
      - name: Rebuild read-only prospective market dashboard
        run: python scripts/model13_market_validation.py
      - name: Rebuild Phase 2 tracking and calibration dashboard
        run: python scripts/model13_phase2_validation.py
      - name: Commit generated dashboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/model13_market_validation.md reports/model13_market_validation.csv reports/model13_phase2_validation.md reports/model13_phase2_candidates.csv
          if git diff --cached --quiet; then
            echo "Dashboard files are already current."
            exit 0
          fi
          git commit -m "Publish prospective Model 13 validation dashboards"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Dashboards committed."
              exit 0
            fi
            echo "Retry push after concurrent commit ($attempt)"
          done
          echo "Unable to publish dashboards" >&2
          exit 1
