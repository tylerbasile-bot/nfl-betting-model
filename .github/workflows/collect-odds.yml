name: Capture NFL pregame moneylines

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical test dependency
        run: python -m pip install pandas==2.3.3
      - name: Test Model 10 prospective integrity
        run: python -m unittest discover -s tests -v
      - name: Download and record pregame odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/collect_odds.py
      - name: Record daily QB and OL injury observations
        run: python scripts/collect_injuries.py
      - name: Build QB and OL injury watchboard
        run: python scripts/injury_watch.py
      - name: Compare QB and OL injury reports across observation dates
        run: python scripts/injury_changes.py
      - name: Match verified NFL final scores
        run: python scripts/collect_results.py
      - name: Build Model 9 market research dashboard
        run: python scripts/model9.py
      - name: Build Model 10 prospective forecast ledger
        run: python scripts/model10.py
      - name: Build Model 11 independent research audit
        run: python scripts/model11.py
      - name: Build Model 13 cross-book paper study
        run: python scripts/model13.py
      - name: Verify prospective Model 13 final scores independently
        run: python scripts/collect_model13_results.py
      - name: Build Model 13 prospective market-validation dashboard
        run: python scripts/model13_market_validation.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds/ reports/
          if [ -d data/injury_observations ]; then git add data/injury_observations/; fi
          if [ -d data/model13 ]; then git add data/model13/; fi
          if [ -f data/results.csv ]; then git add data/results.csv; fi
          if [ -d data/model10 ]; then git add data/model10/; fi
          if [ -d data/model11 ]; then git add data/model11/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Store NFL odds snapshot"
            # The branch might have advanced since checkout.
            # Rebase our data commit on the latest main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Snapshot committed and pushed."
                exit 0
              fi
              echo "Push raced with another commit; retrying..."
            done
            echo "Could not push after three attempts." >&2
            exit 1
          else
            echo "No new snapshot changes."
          fi
