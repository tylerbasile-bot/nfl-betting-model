name: Capture NFL pregame moneylines

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Model 10 prospective integrity
        run: python -m unittest discover -s tests -v
      - name: Download and record pregame odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/collect_odds.py
      - name: Build Model 9 market research dashboard
        run: python scripts/model9.py
      - name: Build Model 10 prospective forecast ledger
        run: python scripts/model10.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds/ reports/
          if [ -d data/model10 ]; then git add data/model10/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Store NFL odds snapshot"
            # The branch might have advanced since checkout.
            # Rebase our data commit on the latest main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Snapshot committed and pushed."
                exit 0
              fi
              echo "Push raced with another commit; retrying..."
            done
            echo "Could not push after three attempts." >&2
            exit 1
          else
            echo "No new snapshot changes."
          fi
