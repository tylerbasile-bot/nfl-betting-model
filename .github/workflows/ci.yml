name: Research code integrity tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical test dependency
        run: python -m pip install pandas==2.3.3 scikit-learn==1.7.2
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Run offline integrity tests
        run: python -m unittest discover -s tests -v
